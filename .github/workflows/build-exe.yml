name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-exe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Windows EXE via Docker
        run: docker buildx build --platform linux/amd64 --output type=local,dest=./dist .

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageUtil-windows-exe
          path: dist/ImageUtil.exe

      - name: Upload Windows portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageUtil-windows-portable
          path: dist/ImageUtil-windows-portable.zip

      - name: Upload runnable JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageUtil-jar
          path: dist/ImageUtil.jar

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ImageUtil.exe
            dist/ImageUtil-windows-portable.zip
            dist/ImageUtil.jar
